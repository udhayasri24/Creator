{% extends "base.html" %}

{% block title %}Create Account — CreatorIQ Dashboard{% endblock %}

{% block content %}
<!-- Top minimal nav for auth -->
<header class="landing-nav">
  <div class="nav-container">
    <a href="{{ url_for('main.index') }}" class="brand-logo">
      <div class="brand-icon-box">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v18h18"></path>
          <path d="m19 9-5 5-4-4-3 3"></path>
        </svg>
      </div>
      <span>Creator<span class="gradient-text">IQ</span></span>
    </a>

    <div class="nav-actions">
      <button class="btn-icon theme-toggle-btn" aria-label="Toggle Theme">
        <span class="theme-toggle-icon"></span>
      </button>
      <a href="{{ url_for('main.index') }}" class="btn btn-outline btn-sm">Back to Home</a>
    </div>
  </div>
</header>

<div class="auth-wrapper">
  <div class="hero-glow-bg" style="top: 5%; width: 500px; height: 400px;"></div>

  <div class="auth-card" style="max-width: 500px;">
    <div class="auth-header">
      <div class="badge badge-primary" style="margin-bottom: 0.75rem;">Account Registration</div>
      <h2>Get Started with CreatorIQ</h2>
      <p>Set up your analytics command center in seconds</p>
    </div>

    <form action="{{ url_for('auth.register') }}" method="POST">
      <div class="form-group">
        <label class="form-label" for="full_name">Full Name</label>
        <input 
          type="text" 
          id="full_name" 
          name="full_name" 
          class="form-input" 
          placeholder="e.g. Alex Rivera" 
          value="{{ full_name or '' }}"
          required
          autofocus
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Work / Creator Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          class="form-input" 
          placeholder="alex@example.com" 
          value="{{ email or '' }}"
          required
        >
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-input" 
            placeholder="At least 6 characters" 
            required
          >
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm Password</label>
          <input 
            type="password" 
            id="confirm_password" 
            name="confirm_password" 
            class="form-input" 
            placeholder="Confirm password" 
            required
          >
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="role">Select Your Primary Role</label>
        <select id="role" name="role" class="form-select" required>
          <option value="Creator" {% if role == 'Creator' or not role %}selected{% endif %}>Creator (Solo YouTuber, Influencer, Podcaster)</option>
          <option value="Agency" {% if role == 'Agency' %}selected{% endif %}>Agency (Managing multiple creator rosters)</option>
          <option value="Marketing Team" {% if role == 'Marketing Team' %}selected{% endif %}>Marketing Team (Brand partner & campaigns)</option>
          <option value="Administrator" {% if role == 'Administrator' %}selected{% endif %}>Administrator (Platform operations & governance)</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
        <span>Create My CreatorIQ Account</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? 
      <a href="{{ url_for('auth.login') }}">Log in here</a>
    </div>
  </div>
</div>
{% endblock %}
