{% extends "base.html" %}

{% block title %}Sign In — CreatorIQ Dashboard{% endblock %}

{% block content %}
<!-- Top minimal nav for auth -->
<header class="landing-nav">
  <div class="nav-container">
    <a href="{{ url_for('main.index') }}" class="brand-logo">
      <div class="brand-icon-box">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v18h18"></path>
          <path d="m19 9-5 5-4-4-3 3"></path>
        </svg>
      </div>
      <span>Creator<span class="gradient-text">IQ</span></span>
    </a>

    <div class="nav-actions">
      <button class="btn-icon theme-toggle-btn" aria-label="Toggle Theme">
        <span class="theme-toggle-icon"></span>
      </button>
      <a href="{{ url_for('main.index') }}" class="btn btn-outline btn-sm">Back to Home</a>
    </div>
  </div>
</header>

<div class="auth-wrapper">
  <div class="hero-glow-bg" style="top: 10%; width: 450px; height: 350px;"></div>

  <div class="auth-card">
    <div class="auth-header">
      <div class="badge badge-primary" style="margin-bottom: 0.75rem;">Account Authentication</div>
      <h2>Welcome Back</h2>
      <p>Log in to access your CreatorIQ analytics command center</p>
    </div>

    <form action="{{ url_for('auth.login') }}" method="POST">
      <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          class="form-input" 
          placeholder="your.email@creatoriq.com" 
          value="{{ email or '' }}"
          required
          autofocus
        >
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.45rem;">
          <label class="form-label" for="password" style="margin-bottom: 0;">Password</label>
        </div>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-input" 
          placeholder="Enter your password" 
          required
        >
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
        <span>Sign In to Dashboard</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </form>

    <div class="auth-footer">
      Don't have a CreatorIQ account? 
      <a href="{{ url_for('auth.register') }}">Create an account</a>
    </div>
  </div>
</div>
{% endblock %}
